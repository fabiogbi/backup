name: iphone_backup
description: Backup de fotos/vídeos do iPhone para o NAS via Tailscale.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  photo_manager: ^3.0.0
  path: ^1.9.0
  shared_preferences: ^2.2.0
  flutter_background_service: ^5.0.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
